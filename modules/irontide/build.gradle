plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'irontide'
        }
    }
    mods {
        "irontide" { sourceSet(sourceSets.main) }
    }
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

tasks.configureEach {
    if (name in ['runClient', 'runServer', 'runGameTestServer']) {
        dependsOn 'processResources', 'classes'
    }
}

// Create 6.0.10 的动力学 API（编译期只需 jar，运行时由整合包提供）
dependencies {
    // Create 6 把 ponder/flywheel/registrate 以 jar-in-jar 打包，编译期一并挂上
    compileOnly files(
            "libs/create-1.21.1-6.0.10.jar",
            "libs/ponder-neoforge-1.0.82+mc1.21.1.jar",
            "libs/flywheel-neoforge-1.21.1-1.0.6.jar",
            "libs/Registrate-MC1.21-1.3.0+67.jar"
    )
}
